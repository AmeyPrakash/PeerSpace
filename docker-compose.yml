services:
  peerspace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peerspace-app
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - COUNSELOR_PASSKEY=${COUNSELOR_PASSKEY}
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped
