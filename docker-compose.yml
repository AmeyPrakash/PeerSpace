services:
  peerspace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peerspace-app
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - COUNSELOR_PASSKEY=${COUNSELOR_PASSKEY}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/peerspace
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: peerspace-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: peerspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
